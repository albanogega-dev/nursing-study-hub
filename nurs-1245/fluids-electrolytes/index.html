<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Fluids & Electrolytes | NURS 1245</title><style>*{box-sizing:border-box}body{margin:0;font-family:system-ui,-apple-system,Segoe UI,Roboto;background:#f4f7fb;color:#172033}.wrap{max-width:1050px;margin:auto;padding:22px}.hero{background:linear-gradient(135deg,#dff6ff,#eef2ff);border:1px solid #cddfea;border-radius:24px;padding:28px;margin:15px 0}.small{color:#667085}.tabs{display:flex;gap:8px;overflow:auto;padding:8px 0 14px;position:sticky;top:0;background:#f4f7fb;z-index:3}.tab{white-space:nowrap;border:1px solid #ccd5e2;background:white;border-radius:999px;padding:10px 14px;cursor:pointer}.tab.active{background:#172033;color:white}.panel{display:none}.panel.active{display:block}.card{background:white;border:1px solid #d9e1ec;border-radius:18px;padding:18px;margin:12px 0}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:12px}.memory{background:#fff8db;border-left:5px solid #eab308}.danger{background:#fff1f2;border-left:5px solid #e11d48}.good{background:#ecfdf3;border-left:5px solid #16a34a}.pill{display:inline-block;padding:5px 9px;background:#e8eef7;border-radius:999px;font-size:12px;font-weight:700;margin:3px}.flow{font-size:18px;font-weight:800;text-align:center;line-height:2}.compare{overflow:auto}table{border-collapse:collapse;width:100%;background:white}th,td{padding:10px;border:1px solid #d9e1ec;text-align:left}th{background:#eef2f7}.qbtn{display:block;width:100%;text-align:left;padding:12px;margin:7px 0;border:1px solid #d5dce7;border-radius:11px;background:white}.correct{background:#ecfdf3!important;border-color:#16a34a!important}.wrong{background:#fff1f2!important;border-color:#e11d48!important}.flash{min-height:160px;display:flex;align-items:center;justify-content:center;text-align:center;font-size:20px;cursor:pointer}.back{color:#475467;text-decoration:none}@media(max-width:600px){.hero{padding:20px}.wrap{padding:14px}}</style></head><body><main class="wrap"><a class="back" href="../index.html">← NURS 1245</a><section class="hero"><div class="small">NURS 1245 • POWERPOINT-GROUNDED MASTER LAB</div><h1>🩸 Fluids & Electrolytes</h1><p><b>Part 1 + Part 2 combined.</b> Fluid compartments → movement → pressure → hormones → IV fluids → fluid imbalances → Na⁺ → K⁺ → Mg²⁺ → Ca²⁺ → PO₄ → Cl⁻.</p></section><nav class="tabs" id="tabs"></nav><section id="content"></section></main><script>const sections=[['foundation','💧 Foundations',`<div class="card"><h2>Total Body Water & Compartments</h2><p>Healthy adult total body water: about <b>50–60% body weight</b>. Infants have more body fluid/ECF and are more prone to deficits; women, obesity and older age are associated with less body water in the slides.</p><div class="flow">TBW → ICF ≈ 2/3 &nbsp; + &nbsp; ECF ≈ 1/3</div><div class="grid"><div class="card"><b>ICF = inside cells</b><p>Most abundant electrolyte: <b>K⁺</b>.</p></div><div class="card"><b>ECF = outside cells</b><p>Most abundant electrolyte: <b>Na⁺</b>. Includes intravascular, interstitial and transcellular fluid.</p></div></div></div><div class="card"><h2>Why fluid matters</h2><p>Transports nutrients/waste, hormones, enzymes and blood cells; supports cellular metabolism; acts as solvent; maintains temperature and BP; assists digestion/elimination; lubricates tissue.</p></div><div class="memory card"><b>🧠 Core memory:</b> <b>K lives IN; Na lives OUT.</b></div>`],['movement','🔄 Movement',`<div class="grid"><div class="card"><h3>Osmosis</h3><p><b>FLUID moves</b> to achieve concentration balance.</p></div><div class="card"><h3>Diffusion</h3><p><b>SOLUTES: HIGH → LOW</b>.</p></div><div class="card"><h3>Active Transport</h3><p><b>LOW → HIGH</b>; requires energy/ATP. Think sodium-potassium pump.</p></div><div class="card"><h3>Filtration</h3><p>Pressure forces fluid + solutes through capillary wall.</p></div><div class="card"><h3>Reabsorption</h3><p>Helps prevent too much fluid from leaving capillaries.</p></div></div><div class="card"><h2>Pressure battle</h2><div class="flow">Hydrostatic pressure = PUSH OUT ↔ Colloid osmotic pressure = PULL IN</div><p><b>Albumin</b> acts like a water magnet and helps pull/hold water in the vessel.</p></div><div class="memory card"><b>🧠 Edema:</b> ↑ hydrostatic PUSH OUT or ↓ colloid/albumin PULL IN.</div>`],['control','🧠 Fluid Control',`<div class="grid"><div class="card"><h3>ADH / Vasopressin</h3><p><b>Holds WATER.</b> Increased serum osmolality or decreased blood volume stimulates ADH → more H₂O reabsorption → concentrated urine.</p></div><div class="card"><h3>Renin / RAAS</h3><p>Kidney response that helps regulate BP. Renin → angiotensin II/vasoconstriction → stimulates aldosterone.</p></div><div class="card"><h3>Aldosterone</h3><p><b>Retains Na⁺ + H₂O</b> and promotes K⁺ excretion.</p></div><div class="card"><h3>ANP</h3><p><b>Opposes RAAS.</b> Released with increased atrial pressure; promotes sodium/water excretion and decreases blood volume/BP.</p></div></div><div class="memory card"><b>🧠 ADH = hold water • Aldosterone = save Na + H₂O • ANP = let Na + H₂O go.</b></div>`],['iv','💉 IV Fluids',`<div class="grid"><div class="card"><h3>Isotonic</h3><p>Same concentration as plasma. Slides list <b>0.9% NS, LR/RL</b> and D5W as isotonic in the bag.</p></div><div class="card"><h3>Hypotonic</h3><p>Lower particle concentration. Slides list <b>0.45% NaCl, 0.33% NaCl</b>. Water moves toward cells.</p></div><div class="card"><h3>Hypertonic</h3><p>Higher particle concentration. Draws water <b>out of cells → intravascular space</b>; cells shrink. Examples in slides include dextrose/saline combinations and D10W.</p></div></div><div class="memory card"><b>D5W:</b> “isotonic in a bag; hypotonic in the body” after dextrose is metabolized.</div><div class="card"><h3>Albumin / colloid</h3><p>Plasma expander that pulls interstitial fluid into circulation. Watch for SOB, increased BP/pulse and hypervolemia.</p></div><div class="card"><b>Weight facts from slides:</b> 1 L water ≈ 2.2 lb = 1 kg; 1 lb weight change ≈ 500 mL fluid.</div>`],['imbalances','⚖️ Fluid Imbalances',`<div class="grid"><div class="card"><h3>Dehydration</h3><p>Water/electrolyte change in ECF can trigger ICF shift and <b>cell shrinkage</b>. Slides distinguish isotonic, hypertonic and hypotonic dehydration.</p></div><div class="card"><h3>Hypovolemia</h3><p>Deficiency of H₂O + solutes in ECF. Think GI losses, hemorrhage, burns, sweating, third spacing, diuretics, DI.</p><b>Signs:</b> orthostatic hypotension, dizziness, weight loss, delayed refill, flat JVD, weak/thready pulse, tachycardia, thirst, dry mucosa.</div><div class="card"><h3>Hypervolemia</h3><p>Excess isotonic water + sodium in ECF.</p><b>Signs:</b> edema, crackles, bounding pulse, ↑BP, JVD, weight gain, SOB, S3.</div><div class="card"><h3>Third spacing</h3><p>Fluid leaves useful circulating space and becomes trapped in a “purgatory” space. Circulating volume falls even though swelling/weight gain may occur.</p></div></div><div class="danger card"><b>Hypovolemic shock:</b> slides associate ~40% fluid loss with severe/shock; findings include ↓urine, cyanosis, AMS/LOC, hypotension and ↑HR.</div><div class="memory card"><b>🧠 Third spacing = fluid is THERE, but in the WRONG PLACE.</b></div><div class="card"><h3>Water intoxication</h3><p>Excess low-sodium/hypotonic fluid → water enters cells → swelling. Slides list SIADH, excessive intake, D5W, tap-water irrigation/enemas, medications and psychogenic polydipsia. Watch neuro status, headache, lethargy, seizures/coma; fluid restrict and avoid hypotonic solutions per slides.</p></div>`],['sodium','🧂 Sodium',`<div class="card"><h2>Na⁺ 135–145 mEq/L</h2><p>Major ECF electrolyte; fluid distribution/BP, nerve/muscle impulses and acid-base balance. <b>“Where sodium goes, water follows.” Think NEURO.</b></p></div><div class="grid"><div class="card"><h3>Hyponatremia &lt;135</h3><p>Slides divide it into <b>isovolemic, hypovolemic and hypervolemic</b> forms.</p><p>Findings include headache/confusion, lethargy, seizures, muscle twitching/weakness, GI symptoms and decreased reflexes.</p><p>Interventions vary by volume/cause: treat cause, neuro checks, daily weights/I&O, sodium replacement/high-Na diet in appropriate cases; severe cases may use carefully administered hypertonic saline per slides.</p></div><div class="card"><h3>Hypernatremia &gt;145</h3><p>Often a water deficit/dehydration picture. Restlessness, agitation, thirst, dry skin/mucosa, confusion, seizures, hyperreflexia, fever/flushed skin.</p><p>Slides: free water/salt-free fluids, Na restriction, assess VS/LOC/I&O/labs/weight; gradual sodium reduction to avoid cerebral edema.</p></div></div><div class="memory card"><b>🧠 Na = WATER + BRAIN.</b></div>`],['potassium','❤️ Potassium',`<div class="card"><h2>K⁺ 3.5–5 mEq/L</h2><p>Major ICF electrolyte; skeletal/heart muscle contraction, nerve impulses and acid-base balance. Small changes can have profound effects.</p></div><div class="grid"><div class="card"><h3>Hypokalemia &lt;3.5</h3><p><b>“If it’s LOW, it’s SLOW.”</b> Weak/irregular pulse, leg weakness/cramps, fatigue, respiratory weakness, ↓GI motility/constipation, ↓reflexes.</p><p>ECG: depressed ST, flat T, prominent <b>U-wave</b>.</p><p>Replace K; high-K foods. <b>Never IV push/bolus. Slides state max 10 mEq/hr and use a pump.</b></p></div><div class="card"><h3>Hyperkalemia &gt;5</h3><p>Renal failure, tissue damage/acidosis, DKA/insulin deficit, K-sparing/ACE/NSAIDs, excess K.</p><p>Weakness/paresthesia → paralysis/respiratory distress; bradycardia/irregular rhythm/hypotension.</p><p>ECG: <b>tall peaked T</b>, flat/absent P, wide QRS, prolonged PR; VF/VT possible.</p><p>Slides: restrict/eliminate K via loop diuretic, dialysis, Kayexalate; shift K with insulin+dextrose/albuterol; calcium for myocardial effects; cardiac monitor.</p></div></div><div class="danger card"><b>🚨 Potassium = HEART + MUSCLES.</b> Rhythm changes are high priority.</div>`],['magnesium','⚡ Magnesium',`<div class="card"><h2>Mg²⁺ 1.3–2.1 mEq/L</h2><p>Electrical nerve/muscle activity, cardiac contractility, ATP/cell metabolism, skeletal contraction and influence on K/Ca movement.</p></div><div class="grid"><div class="card"><h3>Hypomagnesemia</h3><p>Think <b>TWITCHING</b>: irritability/confusion, cramping/seizures, +Chvostek/+Trousseau, cardiac changes/Torsades, weak respirations. Slides: replace Mg orally or IV MgSO₄ slowly; neuro/safety monitoring.</p></div><div class="card"><h3>Hypermagnesemia</h3><p>Think <b>LETHARGIC</b>: weakness/confusion, diminished/absent reflexes, hypotension, bradyarrhythmia, impaired breathing → respiratory/cardiac arrest. Slides: fluids, loop diuretics, dialysis, IV calcium gluconate, avoid Mg in renal patients.</p></div></div><div class="memory card"><b>🧠 Mg = MELLOW:</b> too low → excitable/twitchy; too high → sluggish/lethargic.</div>`],['calcium','🦴 Calcium',`<div class="card"><h2>Ca²⁺ total 8.5–10.5 mg/dL</h2><p>Bone/teeth structure, membrane/impulse transmission and blood clotting. Vitamin D aids absorption; PTH releases calcium when needed.</p></div><div class="grid"><div class="card"><h3>Hypocalcemia</h3><p><b>CRAMPS</b>: confusion, hyperactive reflexes, muscle spasms/seizures, +Trousseau, +Chvostek, laryngeal spasm. ECG: prolonged QT/ST.</p><p>Slides: calcium replacement, Mg/Vit D as indicated, reduce phosphate, monitor stridor/ECG/labs and safety.</p></div><div class="card"><h3>Hypercalcemia</h3><p>Body is too <b>WEAK</b>: profound muscle weakness, absent reflexes, abdominal distention, kidney stones; pathological fractures may occur. ECG: shortened QT.</p><p>Slides: hydration, diuretics/dialysis, treatments to reduce bone resorption/GI uptake, monitor and ambulate/strain urine.</p></div></div><div class="memory card"><b>🧠 Low Ca = HIGH excitement. High Ca = LOW/sluggish.</b></div>`],['phoscl','🔋 Phos & Chloride',`<div class="grid"><div class="card"><h3>Phosphorus / PO₄</h3><p>Slides list normal around <b>3.0–4.5 mg/dL</b> in the phosphorus section. Supports nerve/muscle function, bone with Ca, WBC/platelets, metabolism and pH buffering.</p><p><b>Hypophosphatemia:</b> weakness/confusion, fractures; increase intake/supplement.</p><p><b>Hyperphosphatemia:</b> increased intake/decreased excretion, cell destruction; calcium relationship is reciprocal; fluids/diuretics/dialysis listed.</p></div><div class="card"><h3>Chloride / Cl⁻</h3><p>Slides list <b>96–106 mEq/L</b> in the chloride section. Travels with Na to maintain serum osmolality, supports acid-base balance and gastric HCl.</p><p>Hyperchloremia: same S/S pattern as hypernatremia. Hypochloremia: same pattern as hyponatremia.</p></div></div><div class="memory card"><b>🧠 PO₄ = POWER/energy + bone. Cl follows Na and helps acid-base.</b></div>`],['quiz','🎯 Quiz',`<div class="card"><h2>NCLEX-style Quick Check</h2><div id="quiz"></div></div>`],['flash','🃏 Flashcards',`<div class="card flash" id="flash" onclick="flip()"></div><p class="small">Tap the card to flip. Use Next to cycle.</p><button class="tab" onclick="nextFlash()">Next Card →</button>`]];let current=sections[0][0];const tabs=document.getElementById('tabs'),content=document.getElementById('content');sections.forEach(s=>{let b=document.createElement('button');b.className='tab';b.textContent=s[1];b.onclick=()=>show(s[0]);b.dataset.id=s[0];tabs.appendChild(b)});function show(id){current=id;content.innerHTML=sections.find(s=>s[0]===id)[2];document.querySelectorAll('.tab[data-id]').forEach(b=>b.classList.toggle('active',b.dataset.id===id));if(id==='quiz')renderQ();if(id==='flash')renderFlash();scrollTo(0,0)}show('foundation');const qs=[['Which electrolyte is most abundant in ICF?',['Sodium','Potassium','Chloride'],1,'K⁺ is the major intracellular electrolyte.'],['Hydrostatic pressure primarily does what?',['Pulls fluid into vessel','Pushes fluid out','Holds potassium in cell'],1,'Hydrostatic pressure = PUSH OUT.'],['Which hormone causes water retention?',['ANP','ADH','Calcitonin'],1,'ADH causes renal water reabsorption.'],['A patient with hypokalemia is most associated with which ECG finding?',['Peaked T wave','Prominent U wave','Short QT'],1,'The slides associate hypokalemia with a prominent U-wave.'],['Which finding fits hyperkalemia?',['Tall peaked T wave','U wave','Decreased reflexes only'],0,'Tall peaked T-wave is a classic slide finding.'],['Third spacing means:',['Fluid is eliminated from body','Fluid is trapped in a nonfunctional space','Only intracellular dehydration'],1,'Fluid is present but shifted away from useful circulating volume.'],['Which electrolyte should make you think neurological changes and water balance?',['Sodium','Phosphorus','Chloride only'],0,'Na = WATER + BRAIN.'],['Low calcium tends to cause:',['Sluggish reflexes','Hyperactive neuromuscular signs','No muscle changes'],1,'Hypocalcemia is associated with cramps, spasms, +Chvostek and +Trousseau.']];let qi=0,locked=false;function renderQ(){locked=false;let q=qs[qi];document.getElementById('quiz').innerHTML='<h3>'+(qi+1)+'/'+qs.length+' — '+q[0]+'</h3>'+q[1].map((x,i)=>'<button class="qbtn" onclick="ans('+i+',this)">'+String.fromCharCode(65+i)+'. '+x+'</button>').join('')+'<div id="fb" class="small">Choose the best answer.</div><button class="tab" onclick="nextQ()">Next Question →</button>'}function ans(i,b){if(locked)return;locked=true;let a=qs[qi][2],bs=document.querySelectorAll('.qbtn');bs[a].classList.add('correct');if(i!==a)b.classList.add('wrong');document.getElementById('fb').innerHTML=(i===a?'✅ Correct. ':'❌ Review. ')+qs[qi][3]}function nextQ(){qi=(qi+1)%qs.length;renderQ()}const fc=[['ICF electrolyte?','Potassium (K⁺)'],['ECF electrolyte?','Sodium (Na⁺)'],['Hydrostatic pressure?','PUSHES fluid OUT'],['Colloid osmotic / albumin?','PULLS water IN'],['ADH?','HOLD WATER'],['Aldosterone?','Retain Na + H₂O; excrete K'],['ANP?','Get rid of Na + H₂O; opposes RAAS'],['Hypokalemia ECG?','Prominent U-wave'],['Hyperkalemia ECG?','Tall peaked T-wave'],['Hypocalcemia?','CRAMPS / +Chvostek / +Trousseau'],['Third spacing?','Fluid is there, but in the WRONG PLACE']];let fi=0,front=true;function renderFlash(){front=true;document.getElementById('flash').innerHTML='<b>'+fc[fi][0]+'</b>'}function flip(){front=!front;document.getElementById('flash').innerHTML=front?'<b>'+fc[fi][0]+'</b>':'<b>'+fc[fi][1]+'</b>'}function nextFlash(){fi=(fi+1)%fc.length;renderFlash()}</script></body></html>
