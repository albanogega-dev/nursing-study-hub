<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Wound Care | NURS 1245</title><style>*{box-sizing:border-box}body{margin:0;font-family:system-ui,-apple-system,Segoe UI,Roboto;background:#f6f8fb;color:#172033}.wrap{max-width:1050px;margin:auto;padding:22px}.hero{background:linear-gradient(135deg,#fff1f2,#eef2ff);border:1px solid #e6d7de;border-radius:24px;padding:28px;margin:15px 0}.small{color:#667085}.tabs{display:flex;gap:8px;overflow:auto;padding:8px 0 14px;position:sticky;top:0;background:#f6f8fb;z-index:3}.tab{white-space:nowrap;border:1px solid #ccd5e2;background:#fff;border-radius:999px;padding:10px 14px;cursor:pointer}.tab.active{background:#172033;color:#fff}.card{background:#fff;border:1px solid #d9e1ec;border-radius:18px;padding:18px;margin:12px 0}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:12px}.memory{background:#fff8db;border-left:5px solid #eab308}.danger{background:#fff1f2;border-left:5px solid #e11d48}.good{background:#ecfdf3;border-left:5px solid #16a34a}.flow{font-size:18px;font-weight:800;text-align:center;line-height:2}.stage{border-left:5px solid #475467}.qbtn{display:block;width:100%;text-align:left;padding:12px;margin:7px 0;border:1px solid #d5dce7;border-radius:11px;background:#fff}.correct{background:#ecfdf3!important;border-color:#16a34a!important}.wrong{background:#fff1f2!important;border-color:#e11d48!important}.flash{min-height:160px;display:flex;align-items:center;justify-content:center;text-align:center;font-size:20px;cursor:pointer}.back{color:#475467;text-decoration:none}table{border-collapse:collapse;width:100%;background:#fff}th,td{padding:10px;border:1px solid #d9e1ec;text-align:left}th{background:#eef2f7}@media(max-width:600px){.hero{padding:20px}.wrap{padding:14px}}</style></head><body><main class="wrap"><a class="back" href="../index.html">← NURS 1245</a><section class="hero"><div class="small">NURS 1245 • FULL 65-PAGE POWERPOINT MODULE</div><h1>🩹 Wound Care Master Study Lab</h1><p>Skin integrity → wound classification → healing → complications → assessment → pressure injuries → ulcer types → prevention → dressings → wound VAC/debridement → drains → heat/cold.</p></section><nav class="tabs" id="tabs"></nav><section id="content"></section></main><script>const sections=[['fund','🧴 Skin & Classification',`<div class="card"><h2>Skin fundamentals</h2><div class="grid"><div><b>Epidermis</b><p>Protective waterproof keratin layer; cells have no blood vessels; regenerates quickly.</p></div><div><b>Dermis</b><p>Elastic collagen-rich tissue with nerves, follicles, glands, immune cells and blood vessels.</p></div><div><b>Subcutaneous</b><p>Anchors skin layers to underlying tissues.</p></div></div></div><div class="card"><h2>Wound classification</h2><p><b>Open vs closed • Intentional vs unintentional • Acute vs chronic</b></p><p>Open wounds include incisions/abrasions and create a portal of entry. Closed wounds follow force/trauma without broken skin but can damage soft tissue.</p><div class="grid"><div class="card"><b>Acute</b><p>Days to weeks; edges often well approximated; progresses through normal healing.</p></div><div class="card"><b>Chronic</b><p>Healing impeded, often >30 days; edges may not approximate; increased infection risk; examples include diabetes, arterial/venous insufficiency and pressure injuries.</p></div></div></div><div class="card"><h3>Skin integrity risk factors</h3><p>Age/lifespan, chronic conditions and malnutrition. Infants have thinner/weaker skin; older adults have delayed epidermal maturation, impaired circulation/collagen and greater pressure-damage risk.</p></div>`],['heal','🧬 Healing',`<div class="card"><h2>Types of wound healing</h2><p><b>Primary intention:</b> rapid healing with approximated edges and little tissue loss. <b>Secondary intention:</b> wound fills with granulation from bottom upward; edges are not approximated. <b>Tertiary intention:</b> wound intentionally left open initially, then closed later.</p></div><div class="grid"><div class="card"><h3>1. Hemostasis</h3><p>Immediate response: vessel constriction then dilation; exudate/swelling/pain; stimulates cell migration.</p></div><div class="card"><h3>2. Inflammatory</h3><p>Debris ingested and growth factors released; mild fever, leukocytosis and malaise may occur.</p></div><div class="card"><h3>3. Proliferation</h3><p>Regenerative phase; granulation tissue forms; systemic symptoms fade; nutrition and oxygenation are key.</p></div><div class="card"><h3>4. Maturation</h3><p>Collagen remodels; scar becomes flatter/thinner and may affect mobility.</p></div></div><div class="card"><h3>Factors affecting healing</h3><p><b>Systemic:</b> age, circulation/oxygenation, wound condition, medications/health status such as steroids, nutrition (protein, vitamins A/C, zinc), infection, edema, glucose regulation and foreign material.</p><p><b>Local:</b> pressure, desiccation, maceration, trauma, edema, infection, necrosis and lack of O₂.</p></div>`],['comp','⚠️ Complications',`<div class="card"><h2>Major wound complications</h2><p><b>Infection • Hemorrhage • Dehiscence • Evisceration • Fistula formation</b></p></div><div class="card"><h3>Colonization vs infection</h3><p><b>Colonized:</b> microorganisms grow/multiply without tissue invasion or damage. Colonization can become infection when host conditions change.</p></div><div class="danger card"><h3>Dehiscence / Evisceration</h3><p>Dehiscence = wound edges separate. Evisceration = internal organs/tissue protrude through the opened wound. Treat as an emergency.</p></div><div class="grid"><div class="card"><h3>Fistula</h3><p>Abnormal or surgically created passage between hollow organs or between an organ and body surface. Causes in slides: injury, surgery, infection/abscess, inflammation such as Crohn disease. AV fistulas may be created intentionally for dialysis access.</p></div><div class="card"><h3>Abscess</h3><p>Collection of infected fluid that has not drained; accumulated fluid places pressure on surrounding tissue.</p></div></div><div class="card"><h3>Hematoma</h3><p>Deep bruising/injury, especially in patients receiving anticoagulation, can cause deep or superficial hematoma.</p></div>`],['assess','🔍 Wound Assessment',`<div class="card"><h2>Assessment basics</h2><p>Inspect for <b>sight and smell</b>; palpate/assess appearance, drainage and pain; assess sutures, drains/tubes and signs of complications.</p></div><div class="card"><h3>T.I.M.E. framework shown in slides</h3><p><b>T</b> = tissue in/around wound (granulation, slough, necrosis). <b>I</b> = infection. <b>M</b> = moisture/exudate. <b>E</b> = wound edges (contracted, rolling, undermining).</p></div><div class="grid"><div class="card"><h3>Eschar</h3><p>Cornified/dried-out dead tissue.</p></div><div class="card"><h3>Slough</h3><p>Liquefied or wet dead tissue.</p></div><div class="card"><h3>Undermining</h3><p>Destruction/hollow area under wound edges; tissue separates under the wound edge.</p></div><div class="card"><h3>Tunneling</h3><p>A passageway extending under the skin from the wound.</p></div></div><div class="card"><h3>Measure and document</h3><p>Length, width, diameter if circular, depth, wound-edge approximation, tunneling and undermining. Slides direct use of a cotton-tip applicator at 90° and clock-face direction for pathways.</p></div><div class="danger card"><h3>Signs of infection</h3><p>Swelling, deep red color, warmth, increased/purulent drainage, foul odor, separated edges/dehiscence and increasing pain after 3–4 days.</p></div>`],['drainage','💧 Drainage & Culture',`<div class="card"><h2>Drainage / exudate</h2><p>Document <b>type/color, amount, description and odor.</b></p><table><tr><th>Type</th><th>Meaning/appearance</th></tr><tr><td>Serous</td><td>Thin/clear fluid</td></tr><tr><td>Sanguineous</td><td>Bloody drainage</td></tr><tr><td>Serosanguineous</td><td>Mixed serum + blood</td></tr><tr><td>Purulent</td><td>Pus-like, concerning for infection</td></tr></table></div><div class="card"><h3>Color classification</h3><p><b>Red</b> = proliferative/granulation. <b>Yellow</b> = moist necrotic/oozing tissue. <b>Black</b> = thick eschar, requires debridement per slides. Mixed wounds may contain red/yellow/black components.</p></div><div class="card"><h3>Odor</h3><p>Document as absent, mild, moderate or foul.</p></div><div class="card"><h3>Wound culture steps</h3><p>Clean with sterile saline → select a clean viable ~1 cm² area → rotate applicator with pressure long enough to express tissue fluid → avoid exudate/eschar/necrotic material → avoid contaminating swab → moisten with sterile saline if wound is not oozing → refrigerate promptly if storage is needed.</p></div><div class="card"><h3>Psychological effects</h3><p>Pain, anxiety/fear and changes in body image.</p></div>`],['pressure','🛏️ Pressure Injuries',`<div class="card"><h2>Pressure injury development</h2><p>External pressure, friction/shear, immobility, nutrition/hydration, moisture, mental status, age and nursing-home status are listed risk factors.</p></div><div class="stage card"><h3>Stage I</h3><p><b>Intact skin</b> with non-blanchable localized redness, usually over a bony prominence. Darkly pigmented skin may show different coloration instead of visible blanching.</p></div><div class="stage card"><h3>Stage II</h3><p><b>Partial-thickness dermal loss</b>; shallow open ulcer with red-pink wound bed, usually without slough.</p></div><div class="stage card"><h3>Stage III</h3><p><b>Full-thickness tissue loss</b>; subcutaneous fat may be visible, but bone/tendon/muscle are not exposed. Slough may be present but does not obscure depth. May include undermining/tunneling.</p></div><div class="stage card"><h3>Stage IV</h3><p><b>Full-thickness tissue loss with exposed bone, tendon or muscle.</b> Slough/eschar may be present; undermining/tunneling often occur.</p></div><div class="stage card"><h3>Unstageable</h3><p>Full-thickness tissue loss where base is covered by slough and/or eschar so depth cannot be determined.</p></div><div class="stage card"><h3>Suspected Deep Tissue Injury</h3><p>Purple/maroon localized discolored intact skin or blood-filled blister from underlying damage caused by pressure/shear. Tissue may be painful, firm, mushy, boggy, warmer or cooler than adjacent skin.</p></div><div class="memory card"><b>🧠 Stage memory:</b> 1 = red intact • 2 = partial thickness • 3 = fat may show, no bone • 4 = bone/tendon/muscle exposed • Unstageable = depth hidden by slough/eschar.</div>`],['special','🦶 Special Wounds',`<div class="card"><h2>Moisture-associated skin damage / IAD</h2><p>Chronic urine/stool exposure chemically injures skin. IAD is erythematous and often painful in exposed areas; wounds are shallow with irregular edges and may form mirrored “kissing lesions.” Slides state slough, eschar and granulation tissue are not present.</p></div><div class="card"><h3>Skin tears</h3><p>Caused by shear, friction and/or blunt force with separation of skin layers; common on extremities of older adults and during ADLs, dressing changes and transfers.</p></div><div class="card"><h3>Extravasation</h3><p>Fluid/drug/solution escapes from a vesicant vein into tissue, producing pressure, local inflammation, compartment-like effects, tissue necrosis and skin breakdown.</p></div><div class="grid"><div class="card"><h3>Venous ulcers</h3><p>Usually develop on inner lower leg above the medial malleolus/gaiter area. Venous insufficiency causes blood backup, pressure and excess fluid; fragile inflamed skin can predispose to cellulitis.</p></div><div class="card"><h3>Arterial ulcers</h3><p>Painful deep wounds from inadequate blood flow. Common on feet, between/tips of toes, pressure points, heels and lateral malleolus.</p></div><div class="card"><h3>Diabetic / neuropathic ulcers</h3><p>Common complication of uncontrolled DM associated with poor glycemic control, neuropathy, peripheral vascular disease and poor foot care; commonly occur at repetitive pressure/trauma areas.</p></div></div><div class="card"><h3>Gangrene</h3><p>Slides include gangrenous toe examples as a severe tissue integrity problem.</p></div>`],['prevent','🛡️ Prevention & Braden',`<div class="card"><h2>Pressure injury prevention</h2><p>Turning schedules, HOB management, air beds, floating heels, positioning devices, adequate nutrition/hydration, moisture/incontinence management and risk screening.</p></div><div class="card"><h3>Braden Scale — 6 areas</h3><p>1. Sensory perception<br>2. Moisture<br>3. Activity<br>4. Mobility<br>5. Nutrition<br>6. Friction/shear</p><p>Slides state highest score <b>23</b>, lowest <b>6</b>; <b>lower score = higher risk.</b></p></div><div class="card"><h3>Nutrition markers listed</h3><p>Albumin 3.5–5 mg/dL and prealbumin 12–42 mg/dL are included in the slides' prevention section.</p></div><div class="card"><h3>Pressure ulcer care by stage</h3><p>Stage I: turning/pressure-relieving devices. Stage II: occlusive dressing. Stage III: wet-to-dry/debridement of eschar. Stage IV: same as Stage III and may require skin graft, per the slide.</p></div>`],['dress','🩹 Dressings',`<div class="card"><h2>Purposes of dressings</h2><p>Comfort/aesthetics, remove necrotic tissue/debridement, prevent/control infection, absorb drainage, maintain moist environment, protect wound/surrounding skin, prevent injury and optimize healing.</p></div><div class="card"><h3>Dressing change process</h3><p>Prepare patient → aseptic technique → hand hygiene/precautions → remove old dressing → cleanse → apply new dressing → secure.</p><p>Clean from least contaminated to most contaminated; center outward for ulcers. Slides list normal saline and note Betadine/alcohol/hydrogen peroxide as caustic.</p></div><div class="card"><h3>General wound dressing rules</h3><p>Keep wound tissue moist but surrounding skin dry; moist dressing only on wound; choose absorbent dressing that maintains moisture; use barrier on surrounding skin; minimal tape; pack cavities loosely; wet-to-dry only when ordered; chemical debriders only on necrotic tissue.</p></div><div class="grid"><div class="card"><h3>Hydrocolloid</h3><p>Autolytic debridement; moist environment; stages II–III in slide; light-moderate drainage; necrosis/slough; may remain 3–5 days; not for infected wounds.</p></div><div class="card"><h3>Hydrogel</h3><p>Adds moisture, does not adhere, supports autolytic debridement, reduces pain; useful for dry/minimal-exudate and some infected wounds; not heavy drainage; often needs secondary dressing.</p></div><div class="card"><h3>Alginate</h3><p>Brown seaweed/alginic acid with calcium-sodium salts; highly absorbent; maintains moisture; moderate-heavy exudate, stage 3–4, tunneling/undermining; not minimal drainage/dry eschar.</p></div><div class="card"><h3>Foam</h3><p>Hydrophilic polyurethane/gel; moist environment, nonadherent, insulating and highly absorbent; may remain 3–5 days depending on exudate; stage 2–4/surgical wounds; not dry eschar.</p></div><div class="card"><h3>Transparent film</h3><p>Self-adhesive, waterproof, allows oxygen exchange/visualization, maintains moisture but <b>does not absorb drainage</b>; stage 1/minimal drainage, small partial-thickness wounds and as cover dressing.</p></div><div class="card"><h3>Antimicrobial</h3><p>Examples in slides: AQUACEL Ag/Mepilex Ag. Antibacterial action, can be highly absorbent, often secondary dressing, action may last 7 days; used for draining/nonhealing, pressure, venous/arterial, diabetic, surgical and acute/chronic wounds.</p></div></div>`],['vac','🌀 VAC & Debridement',`<div class="card"><h2>Wound VAC</h2><p><b>Negative-pressure therapy.</b> Slides state it stimulates cell proliferation, blood flow and new vessel growth and pulls wound edges together.</p><p><b>Not used on wounds with necrosis or malignancy</b> per the slide.</p></div><div class="card"><h3>Wound VAC application</h3><p>The slide sequence demonstrates foam placement into the wound, covering/sealing the wound and connecting tubing to the negative-pressure device.</p></div><div class="card"><h2>Debridement</h2><p>Removal of nonviable/necrotic tissue to support wound healing. Earlier slides identify chemical, manual and surgical methods and wet-to-dry debridement when ordered.</p></div><div class="card"><h3>Alternative therapy</h3><p>The deck includes an alternative-therapy wound example and serial wound-progression photos.</p></div><div class="good card"><h3>Desired outcomes</h3><p>Healing • absence of infection • mobility • addressing psychological effects • halting progression.</p></div>`],['drains','🧪 Drains & Tubes',`<div class="grid"><div class="card"><h3>Open drain — Penrose</h3><p>No collection device; drains passively into absorptive dressing from greater pressure. Soft flexible rubber tube; placed into incision during surgery to prevent fluid buildup; often not sutured, safety pin used.</p></div><div class="card"><h3>Closed drains</h3><p>JP/Hemovac use suction/negative pressure and closed collection systems, reducing microorganism entry.</p></div></div><div class="card"><h3>Jackson-Pratt (JP)</h3><p>Used for smaller amounts of drainage. Bulb suction creates negative pressure.</p></div><div class="card"><h3>Hemovac</h3><p>Portable built-in reservoir, constant low suction/negative pressure, pulls fluid against gravity and allows accurate measurement.</p></div><div class="card"><h3>T-tube</h3><p>The slides pair Hemovac and T-tube images as additional closed-drain/tube content.</p></div><div class="card"><h3>Drain care</h3><p>The deck includes emptying wound drains and milking a JP/drain.</p></div>`],['heat','🔥 Heat & ❄️ Cold',`<div class="grid"><div class="card"><h3>Heat therapy</h3><p><b>Vasodilation</b> → increased blood flow, oxygen/nutrient supply; reduces muscle tension. Slides include moist/dry heat applications.</p></div><div class="card"><h3>Cold therapy</h3><p><b>Vasoconstriction</b>; dry/moist cold. Reduces edema/inflammation and decreases tissue sensitivity, producing numbness.</p></div></div>`],['nursing','👩‍⚕️ Nursing',`<div class="card"><h2>Nursing diagnoses from slides</h2><p><b>Impaired skin integrity</b> related to effects of pressure/immobility secondary to fatigue AEB Stage I coccyx wound.</p><p><b>Impaired tissue integrity</b> related to decreased blood/nutrients to tissues secondary to surgery AEB abdominal surgical incision.</p></div><div class="card"><h2>Outcomes from slides</h2><p>Maintain current skin integrity by end of shift: Stage I coccyx wound will not enlarge or progress to Stage II.</p><p>Maintain current tissue integrity: surgical incision remains closed without swelling or drainage.</p></div><div class="card"><h3>Core wound-care principles</h3><p>Intact skin is first-line defense, careful hand hygiene, adequate blood supply is essential, and healing is promoted when the wound is free of foreign material.</p></div>`],['quiz','🎯 Quiz',`<div class="card"><h2>NCLEX-style Quick Check</h2><div id="quiz"></div></div>`],['flash','🃏 Flashcards',`<div class="card flash" id="flash" onclick="flip()"></div><p class="small">Tap to flip.</p><button class="tab" onclick="nextFlash()">Next Card →</button>`]];const tabs=document.getElementById('tabs'),content=document.getElementById('content');sections.forEach(s=>{let b=document.createElement('button');b.className='tab';b.dataset.id=s[0];b.textContent=s[1];b.onclick=()=>show(s[0]);tabs.appendChild(b)});function show(id){content.innerHTML=sections.find(s=>s[0]===id)[2];document.querySelectorAll('.tab[data-id]').forEach(b=>b.classList.toggle('active',b.dataset.id===id));if(id==='quiz')renderQ();if(id==='flash')renderFlash();scrollTo(0,0)}show('fund');const qs=[['Stage I pressure injury is:',['Intact skin with non-blanchable redness','Partial-thickness dermal loss','Exposed bone'],0,'Stage I = intact skin + non-blanchable redness.'],['Which stage may show fat but not exposed bone/tendon/muscle?',['Stage II','Stage III','Stage IV'],1,'Stage III is full-thickness tissue loss; fat may be visible but bone/tendon/muscle are not exposed.'],['A wound base completely covered by slough/eschar is:',['Stage II','Unstageable','Stage I'],1,'If the base is obscured, depth cannot be determined → unstageable.'],['Which dressing has essentially no drainage absorption?',['Transparent film','Alginate','Foam'],0,'Transparent film maintains moisture and allows visualization but does not absorb drainage.'],['Which dressing is useful for moderate-heavy exudate and tunneling?',['Alginate','Transparent film','Hydrogel only'],0,'Alginate is highly absorbent and is listed for tunneling/undermining.'],['A purple/maroon intact area after intense pressure suggests:',['IAD','Deep tissue injury','Stage II'],1,'Purple/maroon intact discoloration is a DTI clue.'],['Lower Braden score means:',['Lower risk','Higher risk','No relationship'],1,'The slides state lower score = higher pressure-injury risk.'],['Undermining is:',['A passageway extending outward','Tissue separation under the wound edge','Purulent drainage'],1,'Undermining is a hollow/separation beneath the wound edge.'],['A JP drain is:',['Open passive drain','Closed suction drain','No collection device'],1,'JP is a closed negative-pressure/suction drain.'],['Cold therapy causes:',['Vasodilation','Vasoconstriction','Increased edema'],1,'Cold causes vasoconstriction and reduces edema/inflammation.']];let qi=0,locked=false;function renderQ(){locked=false;let q=qs[qi];document.getElementById('quiz').innerHTML='<h3>'+(qi+1)+'/'+qs.length+' — '+q[0]+'</h3>'+q[1].map((x,i)=>'<button class="qbtn" onclick="ans('+i+',this)">'+String.fromCharCode(65+i)+'. '+x+'</button>').join('')+'<div id="fb" class="small">Choose the best answer.</div><button class="tab" onclick="nextQ()">Next Question →</button>'}function ans(i,b){if(locked)return;locked=true;let a=qs[qi][2],bs=document.querySelectorAll('.qbtn');bs[a].classList.add('correct');if(i!==a)b.classList.add('wrong');document.getElementById('fb').innerHTML=(i===a?'✅ Correct. ':'❌ Review. ')+qs[qi][3]}function nextQ(){qi=(qi+1)%qs.length;renderQ()}const fc=[['Stage I?','Intact, non-blanchable redness'],['Stage II?','Partial-thickness dermal loss'],['Stage III?','Full thickness; fat may show, no exposed bone/tendon/muscle'],['Stage IV?','Exposed bone/tendon/muscle'],['Unstageable?','Depth hidden by slough/eschar'],['DTI?','Purple/maroon intact skin or blood-filled blister'],['Slough?','Wet/liquefied dead tissue'],['Eschar?','Dry/cornified dead tissue'],['Undermining?','Hollow under wound edge'],['Tunneling?','Passageway extending under skin'],['Alginate?','Absorbs moderate-heavy drainage'],['Hydrogel?','Adds moisture'],['Hydrocolloid?','Maintains moisture/autolytic debridement'],['Transparent film?','No drainage absorption'],['Braden?','Lower score = higher risk'],['Wound VAC?','Negative pressure therapy'],['Penrose?','Open passive drain'],['JP/Hemovac?','Closed suction drains']];let fi=0,front=true;function renderFlash(){front=true;document.getElementById('flash').innerHTML='<b>'+fc[fi][0]+'</b>'}function flip(){front=!front;document.getElementById('flash').innerHTML='<b>'+(front?fc[fi][0]:fc[fi][1])+'</b>'}function nextFlash(){fi=(fi+1)%fc.length;renderFlash()}</script></body></html>
